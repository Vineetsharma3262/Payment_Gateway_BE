# Local development dependencies only. The API runs on the host (`npm run start:dev`)
# or via the optional `api` profile: `docker compose --profile api up --build`.
name: payco

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: payco
      POSTGRES_PASSWORD: payco_dev_password
      POSTGRES_DB: payco
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payco -d payco']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: payco
      POSTGRES_PASSWORD: payco_test_password
      POSTGRES_DB: payco_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['api']
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://payco:payco_dev_password@postgres:5432/payco?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
